# An example only, not in kustomization.yaml: keep real values out of git. Create the Secrets with your secret
# manager, or by hand:
#   kubectl -n chainindex create secret generic chainindex-env \
#     --from-literal=CLICKHOUSE_USER=chainindex --from-literal=CLICKHOUSE_PASSWORD=... --from-literal=RPC_API_KEY=...
#   kubectl -n chainindex create secret generic chainindex-api-env \
#     --from-literal=CLICKHOUSE_USER=chainindex_api --from-literal=CLICKHOUSE_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: chainindex-env
  namespace: chainindex
type: Opaque
stringData:
  # Used by the indexer, init and dbt: it creates databases and tables.
  CLICKHOUSE_USER: chainindex
  CLICKHOUSE_PASSWORD: change-me
  # Replaces {key} in the chain file's endpoint URLs. Leave it empty to use keyless endpoints.
  RPC_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: chainindex-api-env
  namespace: chainindex
type: Opaque
stringData:
  # A user with readonly = 2, SELECT on events_* and the status tables, and a quota. See docs/operations.md.
  CLICKHOUSE_USER: chainindex_api
  CLICKHOUSE_PASSWORD: change-me
