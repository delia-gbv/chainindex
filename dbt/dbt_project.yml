# The decoded views over chainindex's raw tables: one per contract kind and event (and per read), generated by
# `chainindex dbt --models-dir dbt/models` from the chain files and ABIs. Each chain's views live in events_<chain>.
name: chainindex_models
version: "1.0.0"
profile: chainindex

model-paths: ["models"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]
