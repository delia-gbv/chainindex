# A tag vX.Y.Z publishes that version: the package to PyPI (trusted publishing, no token stored), a multi-arch image
# to ghcr.io/delia-gbv/chainindex, and a GitHub release whose notes are the changelog's section for it.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.6" }
      - id: version
        name: The tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/delia-gbv/chainindex:${{ needs.build.outputs.version }}
            ghcr.io/delia-gbv/chainindex:latest
          labels: org.opencontainers.image.source=https://github.com/delia-gbv/chainindex

  github:
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - name: Release notes from the changelog
        run: awk -v version="${{ needs.build.outputs.version }}" '$0 ~ "^## \\[" version "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
