name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    # Every supported Python.
    strategy:
      matrix: { python: ["3.12", "3.13", "3.14", "3.15"] }
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.4
        env: { CLICKHOUSE_USER: default, CLICKHOUSE_PASSWORD: "", CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["8123:8123"]
        options: --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-retries 20
    env: { CLICKHOUSE_HOST: localhost, UV_PYTHON: "${{ matrix.python }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.6" }
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: scripts/ci.sh
      - run: docker build -t chainindex:ci .
